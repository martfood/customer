name: Build & Sign Customer App Android (AAB)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'customer_app/**'
      - 'shared_widgets/**'
      - '.github/workflows/build-customer-android.yml'
  workflow_dispatch:

jobs:
  build-android-aab:
    name: Build & Sign Android App Bundle (AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer_app
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Smoke Tests
        run: flutter test test/widget_test.dart

      # ── CONFIGURE KEYSTORE & KEY.PROPERTIES ─────────────────────────────────
      - name: Configure Production Signing Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/app
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat <<EOF > android/key.properties
          storePassword=${KEYSTORE_PASSWORD:-martfoodpass123}
          keyPassword=${KEY_PASSWORD:-martfoodpass123}
          keyAlias=${KEY_ALIAS:-martfoodkey}
          storeFile=app/release.keystore
          EOF
          echo "Production keystore configured from GitHub Secrets."

      - name: Configure Fallback Keystore (if secrets not provided)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias martfoodkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass martfoodpass123 -keypass martfoodpass123 \
            -dname "CN=MartFood, OU=Mobile, O=MartFood, L=Lagos, S=Lagos, C=NG"
          cat <<EOF > android/key.properties
          storePassword=martfoodpass123
          keyPassword=martfoodpass123
          keyAlias=martfoodkey
          storeFile=app/release.keystore
          EOF
          echo "Fallback keystore generated so build succeeds."

      # ── BUILD ANDROID APP BUNDLE (.AAB) ────────────────────────────────────
      - name: Build Android App Bundle (Release AAB)
        run: flutter build appbundle --release

      # ── LOCATE GENERATED AAB ───────────────────────────────────────────────
      - name: Locate AAB Path
        id: find_aab
        run: |
          AAB_FILE=$(find "$GITHUB_WORKSPACE/customer_app/build/app/outputs/bundle/release" -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: No AAB file found in $GITHUB_WORKSPACE/customer_app/build/app/outputs/bundle/release"
            ls -la "$GITHUB_WORKSPACE/customer_app/build/app/outputs/bundle" || true
            exit 1
          fi
          echo "Found AAB: $AAB_FILE"
          echo "aab_path=$AAB_FILE" >> "$GITHUB_OUTPUT"

      # ── UPLOAD AAB ARTIFACT TO GITHUB ACTIONS ──────────────────────────────
      - name: Upload AAB Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-android-aab
          path: customer_app/build/app/outputs/bundle/release/*.aab
          retention-days: 14

      # ── OPTIONAL: DEPLOY TO GOOGLE PLAY STORE (CLOSED TESTING) ─────────────
      - name: Upload to Google Play Console (Closed Testing)
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.martfood.app
          releaseFiles: ${{ steps.find_aab.outputs.aab_path }}
          track: alpha # 'alpha' corresponds to Closed Testing in Google Play Console
          status: completed
