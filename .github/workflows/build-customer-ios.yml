name: Build & Sign Customer App iOS

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'customer_app/**'
      - 'shared_widgets/**'
      - '.github/workflows/build-customer-ios.yml'
  workflow_dispatch:

jobs:
  build-and-sign-ios:
    name: Build & Auto-Sign iOS IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: customer_app
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18+ SDK)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Smoke Tests
        run: flutter test test/widget_test.dart

      # ── INSTALL APPLE CERTIFICATE & PROVISIONING PROFILE ──────────────────
      - name: Install Apple Certificate and Provisioning Profile
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.BUILD_PROVISION_PROFILE_BASE64 != ''
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate and profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate into keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Download and import Apple Worldwide Developer Relations intermediate cert (ensures cert chain is trusted)
          curl -fSL "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign || true

          # Set default keychain and user keychain search list
          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Print detected valid code signing identities
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/d19bc656-22c1-4961-84f7-a9b7ba0c00fb.mobileprovision
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/MartFood_AppStore_Profile.mobileprovision

      # ── BUILD SIGNED IPA (OR UNSIGNED FALLBACK) ───────────────────────────
      - name: Build Signed iOS IPA
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.BUILD_PROVISION_PROFILE_BASE64 != ''
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Build Unsigned IPA (Fallback if secrets not yet set)
        if: env.BUILD_CERTIFICATE_BASE64 == '' || env.BUILD_PROVISION_PROFILE_BASE64 == ''
        run: flutter build ipa --no-codesign

      # ── UPLOAD BUILD ARTIFACTS ────────────────────────────────────────────
      - name: Upload IPA Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-ios-ipa
          path: |
            customer_app/build/ios/ipa/*.ipa
            customer_app/build/ios/archive/Runner.xcarchive
          retention-days: 14

      # ── LOCATE GENERATED IPA ─────────────────────────────────────────────
      - name: Locate IPA Path
        id: find_ipa
        run: |
          IPA_FILE=$(find "$GITHUB_WORKSPACE/customer_app/build/ios/ipa" -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
            echo "ERROR: No IPA file found in $GITHUB_WORKSPACE/customer_app/build/ios/ipa"
            ls -la "$GITHUB_WORKSPACE/customer_app/build/ios" || true
            exit 1
          fi
          echo "Found IPA: $IPA_FILE"
          echo "ipa_path=$IPA_FILE" >> "$GITHUB_OUTPUT"

      # ── UPLOAD TO TESTFLIGHT / APP STORE CONNECT ─────────────────────────
      - name: Upload to TestFlight / App Store Connect
        if: env.APP_STORE_CONNECT_PRIVATE_KEY != '' && env.APP_STORE_CONNECT_KEY_ID != '' && env.APP_STORE_CONNECT_ISSUER_ID != '' && env.BUILD_CERTIFICATE_BASE64 != ''
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.find_ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
