name: customer_app
description: MartFood Customer Application
version: 1.0.0+14
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_widgets:
    path: ../shared_widgets
  firebase_core: ^2.30.1
  firebase_auth: ^4.20.0
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^18.0.1
  cloud_firestore: ^4.17.5
  google_sign_in: ^6.1.6
  shared_preferences: ^2.2.3
  go_router: ^12.1.3
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  lucide_icons_flutter: ^3.0.0
  http: ^1.2.0
  connectivity_plus: ^6.0.3
  webview_flutter: ^4.4.2
  image_picker: ^1.0.7
  firebase_storage: ^11.7.7
  geolocator: ^12.0.0
  google_maps_flutter: ^2.14.2
  permission_handler: ^12.0.2
  flutter_polyline_points: ^2.1.0
  geocoding: ^3.0.0
  uuid: ^4.3.3
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  lottie: ^3.1.0
  url_launcher: ^6.3.0
  country_picker: ^2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/martfood_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/martfood_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/images/
    - assets/category/
    - assets/emoji/
    - assets/promotional_banner/
    - assets/resturant/
    - assets/onboarding/
    - assets/icons/bottom_nav_bar/