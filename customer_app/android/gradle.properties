org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Speed up repeated builds (first build can still take several minutes)
org.gradle.parallel=true
org.gradle.caching=true
# Workaround for occasional AAPT2 daemon startup crashes on macOS/AGP
android.enableAapt2Daemon=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Increase HTTP timeouts for slower connections
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Force Kotlin to compile in-process to prevent daemon connection failures
kotlin.compiler.execution.strategy=in-process

