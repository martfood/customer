name: shared_widgets
description: Shared UI widgets and theme for MartFood project.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  lucide_icons_flutter: ^3.0.0
  flutter_svg: ^2.0.10
  connectivity_plus: ^6.0.3
  http: ^1.2.0
  firebase_core: '>=2.0.0 <4.0.0'
  firebase_auth: '>=4.0.0 <6.0.0'
  cloud_firestore: '>=4.0.0 <6.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
